{% extends 'base.html' %}
{% block title %}Register — Gym Manager{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h2 class="auth-title">Create account</h2>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Password <small>(min 6 characters)</small></label>
                <input type="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-success btn-full">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
